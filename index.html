<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#225bd5"><title>Memory IQ 2</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#12244c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#9cdfff,#e4f5ff 46%,#a6eebf);display:flex;justify-content:center}.app{width:min(100%,480px);min-height:100dvh;padding:19px 17px 40px;background:radial-gradient(circle at 85% 15%,#fff8bd 0%,transparent 28%),linear-gradient(#8ed5ff,#e8faff 52%,#b5f0b0)}.bar,.actions,.metrics{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar{margin-bottom:16px}.pill{padding:9px 13px;border:2px solid white;border-radius:30px;background:#fff9;font-weight:800}.btn{border:0;border-radius:16px;padding:12px 15px;font:inherit;font-weight:850;cursor:pointer;box-shadow:0 4px 0 #132b6b25}.btn:active{transform:translateY(2px)}.primary{color:white;background:linear-gradient(#65d94f,#20aa43)}.blue{color:white;background:linear-gradient(#55c9ff,#2377e5)}.violet{color:white;background:linear-gradient(#c07bff,#7c3fd6)}.gold{color:#713d00;background:linear-gradient(#fff291,#ffc047)}.soft{background:#ffffffd9;color:#274fa3}.wide{width:100%}.view{display:none}.view.active{display:block}.hero{text-align:center;padding:30px 0 16px}.brain{font-size:82px;filter:drop-shadow(0 7px 5px #5680bd55)}h1{font-size:clamp(36px,11vw,53px);line-height:1.1;margin:8px 0;color:#ffb300;text-shadow:2px 2px #2359b7,-2px -2px #2359b7,0 5px #2359b7}h2{text-align:center;color:#234eab;margin:13px 0 20px}p{line-height:1.55}.tag{display:inline-block;border-radius:25px;background:#ffe0f2;padding:8px 17px;font-weight:800;color:#904572}.menu{display:grid;gap:12px;max-width:370px;margin:20px auto}.menu .btn{font-size:18px;padding:15px}.card{background:#ffffffd9;border:2px solid white;border-radius:20px;padding:14px;box-shadow:0 5px 15px #2663a322;margin-bottom:12px}.worlds{display:grid;grid-template-columns:1fr 1fr;gap:10px}.world{padding:16px 8px;text-align:center;background:#fff9;border-radius:18px;border:2px solid white}.world .emoji{font-size:44px}.world small{display:block;color:#506088}.levelgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.lev{border:2px solid white;border-radius:14px;min-height:56px;background:#fffbee;color:#2351a5;font-size:19px;font-weight:900}.lev:disabled{opacity:.45;filter:grayscale(1)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px auto;max-width:420px}.tile{aspect-ratio:1;border-radius:14px;border:3px solid #a7d7ff;background:linear-gradient(135deg,#56acff,#1e69d6);font-size:clamp(27px,9vw,43px);color:#ccecff;display:grid;place-items:center;box-shadow:0 4px #184494}.tile.open,.tile.done{background:#fffaeb;color:#212c55;border-color:white}.tile.done{opacity:.63}.metrics>*{flex:1;background:#1b4481;border-radius:12px;color:white;padding:9px 3px;text-align:center;font-size:12px}.metrics b{display:block;font-size:20px}.bottom{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px auto}.bottom .btn{flex:1;min-width:120px}.scores{display:grid;gap:8px}.score{display:flex;justify-content:space-between;align-items:center;background:white;border-radius:12px;padding:11px 13px}.notice{font-size:13px;background:#eff7ff;color:#345477;padding:10px;border-radius:13px;margin:13px 0}.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:16px}.tabs .btn{font-size:13px;padding:10px}.muted{color:#5f739a;font-size:13px}.hidden{display:none!important}input{width:100%;border-radius:12px;border:2px solid #d0e1ff;padding:14px;font-size:16px;direction:ltr}body.en .app{direction:ltr}button:disabled{cursor:default;opacity:.6}
</style></head><body><main class="app"><header class="bar"><span class="pill">🪙 <span id="coins">0</span></span><span class="pill">🏆 <span id="total">0</span></span><button class="btn soft" id="language" onclick="setLanguage()">English</button></header>
<section id="home" class="view active"><div class="hero"><div class="brain">🧠</div><h1>Memory IQ</h1><span class="tag" data-t="subtitle">لعبة الذاكرة والمنافسة</span></div><div class="menu"><button class="btn primary" onclick="show('worlds')" data-t="play">ابدأ اللعب ▶</button><button class="btn blue" onclick="openDaily()" data-t="daily">📆 التحدي اليومي</button><button class="btn violet" onclick="show('duel')" data-t="duel">⚔️ تحدَّ صديقك</button><button class="btn gold" onclick="showLeaderboard()" data-t="leaders">🏆 المتصدرون</button><button class="btn soft" onclick="startFlash()" data-t="flash">⚡ ذاكرة البرق</button><button class="btn soft" onclick="show('rewards')" data-t="rewards">🎖️ الجوائز والأوسمة</button></div><p class="muted" id="mode"></p></section>
<section id="worlds" class="view"><div class="actions"><button class="btn soft" onclick="show('home')">↩</button><h2 data-t="worldTitle">اختر عالماً</h2></div><div id="worldGrid" class="worlds"></div></section>
<section id="levels" class="view"><div class="actions"><button class="btn soft" onclick="show('worlds')">↩</button><h2 id="worldTitle"></h2></div><div id="levelsGrid" class="levelgrid"></div></section>
<section id="game" class="view"><div class="actions"><button class="btn soft" onclick="abortGame()">✕</button><h2 id="gameTitle"></h2><button class="btn soft" id="pauseBtn" onclick="togglePause()">⏸</button></div><div class="metrics"><div><span data-t="time">الوقت</span><b id="seconds">00:00</b></div><div><span data-t="moves">المحاولات</span><b id="moves">0</b></div><div><span data-t="pairs">الأزواج</span><b id="pairs">0</b></div></div><div class="board" id="board"></div><div id="gameNote" class="notice"></div><div class="bottom"><button class="btn gold" id="hintBtn" onclick="hint()" data-t="hint">💡 تلميح (50)</button><button class="btn blue" onclick="share()" data-t="share">شارك</button></div></section>
<section id="result" class="view"><div class="hero"><div style="font-size:75px">🎉</div><h2 id="resultTitle"></h2><p id="resultText"></p><div id="resultStars" style="font-size:40px"></div></div><div class="menu"><button class="btn primary" onclick="nextGame()" data-t="continue">التالي ▶</button><button class="btn blue" onclick="share()" data-t="share">شارك</button><button class="btn soft" onclick="show('home')" data-t="home">الرئيسية</button></div></section>
<section id="leaderboard" class="view"><div class="actions"><button class="btn soft" onclick="show('home')">↩</button><h2 data-t="leaders">المتصدرون</h2></div><div class="tabs"><button class="btn soft" onclick="loadLeaderboard('all')" data-t="all">الكل</button><button class="btn soft" onclick="loadLeaderboard('daily')" data-t="daily">اليومي</button><button class="btn soft" onclick="loadLeaderboard('flash')" data-t="flash">البرق</button></div><div id="leaderNotice" class="notice"></div><div id="scoreList" class="scores"></div></section>
<section id="duel" class="view"><div class="actions"><button class="btn soft" onclick="show('home')">↩</button><h2 data-t="duel">تحدَّ صديقك</h2></div><div class="card"><p data-t="duelInfo">اصنع تحدياً وشارك رابطه مع صديقك. تلعبان نفس البطاقات.</p><button class="btn primary wide" onclick="createDuel()" data-t="makeDuel">إنشاء تحدٍّ</button></div><div class="card"><input id="duelCode" placeholder="Challenge ID"><button class="btn blue wide" style="margin-top:10px" onclick="joinDuel()" data-t="joinDuel">دخول التحدي</button></div><div id="duelStatus" class="notice"></div></section>
<section id="rewards" class="view"><div class="actions"><button class="btn soft" onclick="show('home')">↩</button><h2 data-t="rewards">الجوائز والأوسمة</h2></div><div id="badges"></div><div class="card"><h3 data-t="coinsTitle">العملات</h3><p id="coinInfo"></p></div></section>
</main><script>
const CONFIG={apiBase:''}; // Set the Cloudflare Worker URL after deployment, e.g. https://memoryiq-api.example.workers.dev
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand()}catch(e){}
const apiBase=CONFIG.apiBase.replace(/\/$/,'');const initData=tg?.initData||'';
const storeKey='memoryiq_v2';let saved;try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){saved={}}
let data={coins:100,points:0,unlocked:1,stars:{},badges:{},...saved},lang=localStorage.getItem('memoryiq_lang')||'ar';let currentWorld=0,game=null,timer=null,locked=false,flipped=[],activeLeaderboard='all';
const dict={ar:{subtitle:'لعبة الذاكرة والمنافسة',play:'ابدأ اللعب ▶',daily:'📆 التحدي اليومي',duel:'⚔️ تحدَّ صديقك',leaders:'🏆 المتصدرون',flash:'⚡ ذاكرة البرق',rewards:'🎖️ الجوائز والأوسمة',worldTitle:'اختر عالماً',time:'الوقت',moves:'المحاولات',pairs:'الأزواج',hint:'💡 تلميح (50)',share:'مشاركة',continue:'التالي ▶',home:'الرئيسية',all:'الكل',duelInfo:'أنشئ تحدياً وشاركه مع صديقك، والاثنان يلعبان نفس البطاقات.',makeDuel:'إنشاء تحدٍّ',joinDuel:'دخول التحدي',coinsTitle:'العملات',offline:'وضع التدريب المحلي: الترتيب والتحديات المشتركة تحتاج ربط الخادم.',online:'متصل بالخادم. النتائج المشتركة مفعلة.',level:'المرحلة',flashTitle:'ذاكرة البرق',dailyTitle:'التحدي اليومي',win:'أحسنت!',lost:'انتهى الوقت',paused:'اللعبة متوقفة',unavailable:'يلزم ربط خادم اللعبة وتسجيل الدخول من تلجرام.',try:'حاول مرة أخرى',dailyDone:'انتهى التحدي',worldNames:['الغابة','البحر','الصحراء','الثلج','الفضاء','المدينة','الحلوى','المزرعة','القلعة','المجرة']},en:{subtitle:'Memory challenges with friends',play:'Play ▶',daily:'📆 Daily Challenge',duel:'⚔️ Challenge a Friend',leaders:'🏆 Leaderboard',flash:'⚡ Flash Memory',rewards:'🎖️ Rewards & Badges',worldTitle:'Choose a World',time:'Time',moves:'Moves',pairs:'Pairs',hint:'💡 Hint (50)',share:'Share',continue:'Next ▶',home:'Home',all:'All',duelInfo:'Create a challenge and share it with a friend. Both play the same cards.',makeDuel:'Create Challenge',joinDuel:'Join Challenge',coinsTitle:'Coins',offline:'Local practice mode: shared scores and duels require the backend.',online:'Connected to backend. Shared scores are enabled.',level:'Level',flashTitle:'Flash Memory',dailyTitle:'Daily Challenge',win:'Well done!',lost:'Time is up',paused:'Paused',unavailable:'Deploy the API backend and open via Telegram to play online.',try:'Try again',dailyDone:'Daily challenge completed',worldNames:['Forest','Ocean','Desert','Snow','Space','City','Candy','Farm','Castle','Galaxy']}};
const worlds=['🌳','🌊','🏜️','❄️','🪐','🏙️','🍭','🚜','🏰','🌌'];const icons=['🍎','🐱','⭐','🐧','🍓','☀️','🍉','🐶','🍀','🚀','🐸','🦋','🍋','🌸','🎈','🦊','🐳','💎','🍒','🌙','🐻','🍄','🦄','🍕'];
const $=id=>document.getElementById(id), tr=k=>dict[lang][k]||k;function persist(){localStorage.setItem(storeKey,JSON.stringify(data));$('coins').textContent=data.coins;$('total').textContent=data.points}function setLanguage(){lang=lang==='ar'?'en':'ar';localStorage.setItem('memoryiq_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.body.classList.toggle('en',lang==='en');$('language').textContent=lang==='ar'?'English':'العربية';document.querySelectorAll('[data-t]').forEach(x=>x.textContent=tr(x.dataset.t));renderWorlds();renderLevels();renderBadges();if(game)renderBoard()}
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));window.scrollTo(0,0);if(id==='rewards')renderBadges()}
function renderWorlds(){$('worldGrid').innerHTML=worlds.map((w,i)=>`<button class="world" onclick="chooseWorld(${i})"><div class="emoji">${w}</div><strong>${tr('worldNames')[i]}</strong><small>${i*10+1}–${i*10+10}</small></button>`).join('')}
function chooseWorld(i){currentWorld=i;renderLevels();show('levels')}function renderLevels(){$('worldTitle').textContent=`${worlds[currentWorld]} ${tr('worldNames')[currentWorld]}`;$('levelsGrid').innerHTML=Array.from({length:10},(_,i)=>{let n=currentWorld*10+i+1;return `<button class="lev" ${n>data.unlocked?'disabled':''} onclick="startLevel(${n})">${n}<small style="display:block">${'★'.repeat(data.stars[n]||0)}</small></button>`}).join('')}
function rnd(seed){let x=seed|0;return ()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}function shuffle(arr,seed){let r=rnd(seed||23),a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(pairs,seed){return shuffle(Array.from({length:pairs},(_,i)=>[icons[(i+seed%icons.length)%icons.length],icons[(i+seed%icons.length)%icons.length]]).flat(),seed)}
function startLevel(n){startGame({type:'level',level:n,seed:n*837271+19,pairs:Math.min(12,3+Math.floor((n-1)/7)),limit:Math.max(35,115-Math.floor(n/2))})}
async function request(path,body){if(!apiBase)throw Error('backend_missing');const res=await fetch(apiBase+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({initData,...body})});let j=await res.json();if(!res.ok)throw Error(j.error||'request_failed');return j}
function authReady(){return !!(apiBase&&initData)}async function openDaily(){if(authReady()){try{let d=await request('/start',{mode:'daily'});startGame({...d,type:'daily',online:true});return}catch(e){alert(e.message)}}const day=new Date().toISOString().slice(0,10).replaceAll('-','');startGame({type:'daily',seed:Number(day),pairs:8,limit:95})}
function startFlash(){if(authReady()){request('/start',{mode:'flash'}).then(d=>startGame({...d,type:'flash',online:true})).catch(e=>alert(e.message));return}startGame({type:'flash',seed:Math.floor(Date.now()/86400000)*31,pairs:6,limit:60})}
function startGame(o){clearInterval(timer);game={...o,deck:buildDeck(o.pairs,o.seed),matched:[],moves:0,sec:0,finished:false,paused:false,events:[],started:Date.now()};flipped=[];locked=false;$('gameTitle').textContent=o.type==='level'?tr('level')+' '+o.level:o.type==='daily'?tr('dailyTitle'):o.type==='flash'?tr('flashTitle'):'⚔️ 1v1';$('gameNote').textContent=o.type==='flash'?(lang==='ar'?'احفظ أماكن البطاقات خلال 4 ثوانٍ':'Memorize the cards in 4 seconds'):'';renderBoard();updateMetrics();show('game');if(o.type==='flash'){locked=true;game.reveal=true;renderBoard();setTimeout(()=>{if(game&&!game.finished){game.reveal=false;locked=false;renderBoard()}},4000)}timer=setInterval(()=>{if(!game||game.finished||game.paused)return;game.sec++;updateMetrics();if(game.sec>=game.limit)finish(false)},1000)}
function renderBoard(){if(!game)return;let cols=game.pairs>=10?4:4;$('board').style.gridTemplateColumns=`repeat(${cols},1fr)`;$('board').innerHTML=game.deck.map((emoji,i)=>{let done=game.matched.includes(i),open=done||flipped.includes(i)||game.reveal;return `<button class="tile ${done?'done':open?'open':''}" onclick="flip(${i})" ${done?'disabled':''} aria-label="Card ${i+1}">${open?emoji:'✦'}</button>`}).join('')}
function flip(i){if(!game||game.finished||game.paused||locked||game.matched.includes(i)||flipped.includes(i))return;flipped.push(i);game.events.push({i,t:Math.max(0,Date.now()-game.started)});renderBoard();if(flipped.length===2){game.moves++;locked=true;updateMetrics();const [a,b]=flipped;setTimeout(()=>{if(!game)return;if(game.deck[a]===game.deck[b])game.matched.push(a,b);flipped=[];locked=false;renderBoard();updateMetrics();if(game.matched.length===game.deck.length)finish(true)},650)}}
function updateMetrics(){if(!game)return;let s=game.sec;$('seconds').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;$('moves').textContent=game.moves;$('pairs').textContent=`${game.matched.length/2}/${game.pairs}`}
function togglePause(){if(!game||game.finished)return;game.paused=!game.paused;$('pauseBtn').textContent=game.paused?'▶':'⏸';$('gameNote').textContent=game.paused?tr('paused'):'';locked=game.paused;renderBoard()}
function hint(){if(!game||game.finished||locked||data.coins<50)return;data.coins-=50;persist();let i=game.deck.findIndex((_,i)=>!game.matched.includes(i)&&!flipped.includes(i));if(i<0)return;locked=true;let other=game.deck.findIndex((x,j)=>j!==i&&x===game.deck[i]&&!game.matched.includes(j));flipped=[i,other];renderBoard();setTimeout(()=>{flipped=[];locked=false;renderBoard()},1200)}
function finish(ok){if(!game||game.finished)return;clearInterval(timer);game.finished=true;let score=ok?Math.max(50,Math.round(1000+game.pairs*75-game.moves*17-game.sec*4)):0;let stars=ok?(game.sec<game.limit*.5?3:game.sec<game.limit*.8?2:1):0;if(ok){data.points+=score;data.coins+=Math.max(10,stars*15);if(game.type==='level'){data.unlocked=Math.max(data.unlocked,Math.min(100,game.level+1));data.stars[game.level]=Math.max(stars,data.stars[game.level]||0)}data.badges.first=1;if(data.unlocked>=11)data.badges.explorer=1;if(data.points>=10000)data.badges.champion=1;persist()}$('resultTitle').textContent=tr(ok?'win':'lost');$('resultText').textContent=`${score} ${lang==='ar'?'نقطة':'points'} · ${game.moves} ${lang==='ar'?'محاولة':'moves'} · ${game.sec}s`;$('resultStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);let completed={...game,score,ok};game=completed;show('result');if(game.online){request('/finish',{runId:game.runId,events:game.events,clientSeconds:game.sec}).then(d=>{$('resultText').textContent+=` · ${d.accepted?'✓ '+(lang==='ar'?'سُجلت النتيجة':'Score saved'):(d.error||'')}`}).catch(e=>{$('resultText').textContent+=` · ${e.message}`})}}
function nextGame(){if(game?.type==='level'&&game.level<100)startLevel(game.level+1);else if(game?.type==='duel'&&game.challengeId)showDuelOutcome();else show('home')}function abortGame(){clearInterval(timer);game=null;show('home')}
async function createDuel(){if(!authReady()){$('duelStatus').textContent=tr('unavailable');return}try{let d=await request('/challenge/create',{});let link=`https://t.me/MemoryIQBot/memoryiq?startapp=duel_${d.challengeId}`;let text=(lang==='ar'?'تحدّاك في لعبة Memory IQ! ':'I challenge you to Memory IQ! ')+link;$('duelStatus').textContent=link;await shareText(text)}catch(e){$('duelStatus').textContent=e.message}}
async function joinDuel(code){code=(code||$('duelCode').value).replace(/^duel_/,'').trim();if(!code)return;if(!authReady()){$('duelStatus').textContent=tr('unavailable');return}try{let d=await request('/challenge/join',{challengeId:code});startGame({...d,type:'duel',online:true,challengeId:code})}catch(e){$('duelStatus').textContent=e.message}}
function showDuelOutcome(){show('duel');$('duelStatus').textContent=lang==='ar'?'افتح التحدي لاحقاً لمعرفة نتيجة الصديق':'Open the challenge later to see your friend’s result'}
async function showLeaderboard(){show('leaderboard');loadLeaderboard('all')}async function loadLeaderboard(mode){activeLeaderboard=mode;$('scoreList').innerHTML='';if(!apiBase){$('leaderNotice').textContent=tr('offline');return}try{let x=await fetch(apiBase+'/leaderboard?mode='+encodeURIComponent(mode));let d=await x.json();if(!x.ok)throw Error(d.error);$('leaderNotice').textContent=lang==='ar'?'نتائج اللاعبين المسجلين':'Verified player scores';$('scoreList').innerHTML=d.rows.map((r,i)=>`<div class="score"><span>${i+1}. ${escapeHtml(r.name)}</span><strong>${r.score} ⭐</strong></div>`).join('')||'—'}catch(e){$('leaderNotice').textContent=e.message}}
function renderBadges(){$('badges').innerHTML=[['first','🥇','First Win','أول فوز'],['explorer','🗺️','Explorer','مستكشف'],['champion','👑','Champion','البطل']].map(x=>`<div class="card">${x[1]} ${lang==='ar'?x[3]:x[2]} ${data.badges[x[0]]?'✅':'🔒'}</div>`).join('');$('coinInfo').textContent=`${data.coins} 🪙 · ${lang==='ar'?'تربح العملات عند الفوز وتستخدمها للتلميحات':'Earn coins by winning and spend them on hints'}`}
async function shareText(s){try{if(navigator.share)await navigator.share({text:s});else if(tg?.openTelegramLink&&s.includes('t.me/'))tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(s.split(' ').at(-1)));else{await navigator.clipboard.writeText(s);alert(lang==='ar'?'تم نسخ الرابط':'Link copied')}}catch(e){prompt('Copy',s)}}function share(){shareText((lang==='ar'?'تحدّاني في لعبة الذاكرة!':'Challenge me in Memory IQ!')+' https://t.me/MemoryIQBot/memoryiq')}
function escapeHtml(s){return String(s||'Player').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function boot(){persist();setLanguage();setLanguage();$('mode').textContent=authReady()?tr('online'):tr('offline');let start=tg?.initDataUnsafe?.start_param||new URLSearchParams(location.search).get('startapp');if(start?.startsWith('duel_')){show('duel');joinDuel(start)}}boot();
</script></body></html>
