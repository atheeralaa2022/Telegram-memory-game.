<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1679d8">
<title>لعبة الذاكرة | Memory Game</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:#18305e;background:linear-gradient(155deg,#9cddff,#dcf8ff 45%,#a7eaa4);display:flex;justify-content:center;align-items:center}button{font:inherit;cursor:pointer;border:0}.app{position:relative;width:min(100%,480px);min-height:100dvh;overflow:hidden;padding:22px 18px 35px;background:radial-gradient(circle at 85% 16%,#fff9bb 0 7%,transparent 28%),linear-gradient(175deg,#75c8fd 0%,#e9faff 49%,#99dc9e 100%)}.app:before{content:'☁️　☁️';position:absolute;top:105px;left:0;font-size:56px;opacity:.45;pointer-events:none}.view{position:relative;z-index:1}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:24px}.pill{background:#fff9;border:2px solid white;box-shadow:0 4px 12px #285b9a33;border-radius:35px;padding:8px 12px;font-weight:900}.mini{padding:9px 13px;background:#fff;border:1px solid #b1dbff;border-radius:15px;color:#19539c;font-weight:800}.hero{text-align:center;margin:58px 0 40px}.mascot{font-size:88px;filter:drop-shadow(0 8px 2px #3279b44d)}h1{font-size:clamp(36px,9vw,52px);line-height:1.2;color:#ffcc34;text-shadow:2px 2px #1760bc,-2px -2px #1760bc,3px 5px #123e91;margin:16px 0}h2{text-align:center;font-size:28px;margin:16px 0 23px;color:#1354a0}p{text-align:center}.subtitle{display:inline-block;background:#ff9cce;color:#611f58;padding:9px 24px;border-radius:25px;box-shadow:0 5px #d265a0;font-weight:800}.menu{display:grid;gap:14px;max-width:340px;margin:auto}.big{border-radius:22px;padding:16px 20px;font-weight:900;font-size:22px;color:#fff;text-shadow:0 1px 2px #16395a77;box-shadow:inset 0 3px #ffffff75,0 6px 0 #255e82,0 10px 15px #24578333;transition:transform .15s}.big:active{transform:translateY(3px)}.green{background:linear-gradient(#8df63b,#26b825)}.purple{background:linear-gradient(#bd74ff,#8136d8)}.gold{background:linear-gradient(#ffd960,#f3a01a)}.blue{background:linear-gradient(#5fd1ff,#1684e1)}.red{background:linear-gradient(#ff8b92,#ed415e)}.levels{display:grid;grid-template-columns:1fr 1fr;gap:13px}.level{border-radius:20px;background:#fffbe8;border:3px solid white;min-height:155px;padding:12px 7px;box-shadow:0 6px 13px #286cb33a;font-weight:900;color:#24406e}.level .scene{display:block;font-size:46px;min-height:63px}.level .stars{color:#f7a900;font-size:20px}.level:disabled{filter:grayscale(.9);opacity:.6;cursor:not-allowed}.back{background:#fff;border-radius:50%;width:46px;height:46px;font-size:22px;color:#2669b7;box-shadow:0 3px 8px #124f8c3a}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:15px 0}.metric{background:#163d74;color:white;text-align:center;padding:9px 4px;border-radius:12px;font-size:13px}.metric strong{display:block;font-size:20px}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:24px auto;max-width:420px}.tile{aspect-ratio:1;border-radius:14px;font-size:clamp(23px,7vw,45px);background:linear-gradient(135deg,#3798ed,#2066ce);border:3px solid #a8dfff;box-shadow:0 4px 0 #164e9d;color:#acd8ff;display:grid;place-items:center;min-width:0}.tile.open,.tile.matched{background:linear-gradient(#fffef7,#fff2d7);border-color:#fff;color:#263854}.tile.matched{box-shadow:0 0 0 3px #4ecf7f,0 3px 0 #2e9b55}.tile:disabled{cursor:default}.gameBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gameBtns button{font-size:16px}.share{margin-top:13px;width:100%}.note{font-size:13px;color:#355b7c;margin:20px 0}.result{background:#ffffffd9;padding:28px 20px;border-radius:24px;text-align:center;box-shadow:0 10px 30px #316da03a;margin:45px 0 25px}.result h2{margin:4px}.result .cup{font-size:72px}.settings{background:#fffe;padding:22px;border-radius:20px}.lang{display:flex;gap:7px}.lang button{padding:9px 12px;border-radius:14px;background:#fff;color:#1253a7;font-weight:800}.lang button.active{background:#155dc1;color:#fff}@media(min-width:600px){body{padding:20px}.app{border-radius:32px;min-height:800px;box-shadow:0 20px 60px #12395e48}.tile{font-size:42px}}
</style>
</head>
<body><main class="app">
<section id="home" class="view"><div class="top"><div class="pill" id="coinsHome">🪙 0</div><div class="lang"><button data-lang="ar" onclick="setLang('ar')">عربي</button><button data-lang="en" onclick="setLang('en')">English</button></div></div><div class="hero"><div class="mascot">🧠</div><h1 data-t="title">لعبة الذاكرة</h1><div class="subtitle" data-t="subtitle">لعبة قناتي على تلجرام</div></div><div class="menu"><button class="big green" data-t="start" onclick="showLevels()">ابدأ ▶</button><button class="big purple" data-t="levels" onclick="showLevels()">🗺️ المراحل</button><button class="big gold" data-t="scores" onclick="showScores()">🏆 المتصدرون</button><button class="big blue" data-t="settings" onclick="show('settings')">⚙️ الإعدادات</button></div></section>
<section id="levels" class="view hidden"><div class="top"><button class="back" onclick="show('home')">↩</button><div class="pill" id="coinsLevels">🪙 0</div></div><h2 data-t="choose">اختر المرحلة</h2><p id="progress"></p><div class="levels" id="levelList"></div></section>
<section id="game" class="view hidden"><div class="top"><button class="back" onclick="pauseToLevels()">↩</button><div class="pill" id="gameTitle"></div><button class="mini" id="pauseButton" onclick="togglePause()">⏸</button></div><div class="metrics"><div class="metric"><span data-t="time">الوقت</span><strong id="timer">00:00</strong></div><div class="metric"><span data-t="moves">المحاولات</span><strong id="moves">0</strong></div><div class="metric"><span data-t="pairs">الأزواج</span><strong id="pairs">0/0</strong></div></div><div class="board" id="board"></div><div class="gameBtns"><button class="big red" data-t="restart" onclick="startLevel(currentLevel)">إعادة</button><button class="big gold" id="hintButton" onclick="hint()">💡 تلميح 50</button></div><button class="big blue share" data-t="share" onclick="shareScore()">شارك نتيجتك</button><p class="note" id="help"></p></section>
<section id="win" class="view hidden"><div class="result"><div class="cup">🏆</div><h2 data-t="won">أحسنت!</h2><div id="winDetail"></div><div id="winStars" style="font-size:42px;color:#f3ab18"></div></div><div class="menu"><button class="big green" data-t="next" onclick="startLevel(Math.min(12,currentLevel+1))">المرحلة التالية</button><button class="big purple" data-t="levels" onclick="showLevels()">المراحل</button><button class="big blue" data-t="share" onclick="shareScore()">شارك نتيجتك</button></div></section>
<section id="scores" class="view hidden"><div class="top"><button class="back" onclick="show('home')">↩</button></div><h2 data-t="records">أفضل نتائجك</h2><div class="settings" id="scoreList"></div><p class="note" data-t="local">النتائج محفوظة في هذا المتصفح فقط. المتصدرون بين جميع أعضاء القناة يحتاجون خادماً وقاعدة بيانات.</p></section>
<section id="settings" class="view hidden"><div class="top"><button class="back" onclick="show('home')">↩</button></div><h2 data-t="settings">الإعدادات</h2><div class="settings"><p data-t="language">اللغة</p><div class="lang" style="justify-content:center"><button onclick="setLang('ar')">العربية</button><button onclick="setLang('en')">English</button></div><p class="note" data-t="settingsInfo">12 مرحلة، مؤقت، تلميحات ونجوم. تقدمك محفوظ على هذا الجهاز.</p></div></section>
</main>
<script>
const dict={ar:{title:'لعبة الذاكرة',subtitle:'لعبة قناتي على تلجرام',start:'ابدأ ▶',levels:'🗺️ المراحل',scores:'🏆 المتصدرون',settings:'⚙️ الإعدادات',choose:'اختر المرحلة',time:'الوقت',moves:'المحاولات',pairs:'الأزواج',restart:'إعادة',share:'شارك نتيجتك',won:'أحسنت!',next:'المرحلة التالية',records:'أفضل نتائجك',local:'النتائج محفوظة في هذا المتصفح فقط. المتصدرون بين أعضاء القناة يحتاجون خادماً وقاعدة بيانات.',language:'اللغة',settingsInfo:'12 مرحلة، مؤقت، تلميحات ونجوم. تقدمك محفوظ على هذا الجهاز.',level:'المرحلة',progress:'المراحل المفتوحة',hint:'💡 تلميح 50',noCoins:'تحتاج إلى 50 عملة',paused:'اللعبة متوقفة مؤقتاً',saved:'أفضل نتيجة',star:'نجوم',sec:'ثانية',help:'اقلب بطاقتين متشابهتين لتجميع زوج',congrats:'أنهيت المرحلة',shareText:'أنهيت المرحلة {level} في لعبة الذاكرة خلال {time} ثانية وبـ {moves} محاولة! 🧠'},en:{title:'Memory Game',subtitle:'My Telegram Channel Game',start:'Start ▶',levels:'🗺️ Levels',scores:'🏆 Leaderboard',settings:'⚙️ Settings',choose:'Choose Level',time:'Time',moves:'Moves',pairs:'Pairs',restart:'Restart',share:'Share Your Score',won:'Well done!',next:'Next Level',records:'Your Best Scores',local:'Scores are saved in this browser only. A channel-wide leaderboard requires a server and database.',language:'Language',settingsInfo:'12 levels, timer, hints and stars. Your progress is saved on this device.',level:'Level',progress:'Unlocked levels',hint:'💡 Hint 50',noCoins:'You need 50 coins',paused:'Game paused',saved:'Best score',star:'Stars',sec:'seconds',help:'Flip two matching cards to find a pair',congrats:'Level completed',shareText:'I finished level {level} of Memory Game in {time} seconds and {moves} moves! 🧠'}};
const icons=['🍎','🦊','⭐','🐧','🍓','☀️','🍉','🐶','🦋','🌸','🚀','🎈','🐱','🥝','🌈','🎲','🍋','🐙','🦄','🍒','🐝','🎁','🍄','⚽'];const scenes=['🌳','🏝️','🏜️','❄️','🏰','🌌','🌺','🌋','🎪','🌊','🚀','👑'];
let lang=localStorage.getItem('memory_lang')||'ar';let coins=Number(localStorage.getItem('memory_coins')??150);let unlocked=Number(localStorage.getItem('memory_unlocked')??1);let records=JSON.parse(localStorage.getItem('memory_records')||'{}');let currentLevel=1,deck=[],flipped=[],matched=0,moves=0,seconds=0,paused=false,locked=false,tick=null,finished=false;
const $=id=>document.getElementById(id), t=k=>dict[lang][k];function persist(){localStorage.setItem('memory_coins',coins);localStorage.setItem('memory_unlocked',unlocked);localStorage.setItem('memory_records',JSON.stringify(records));}
function setLang(l){lang=l;localStorage.setItem('memory_lang',l);document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));document.querySelectorAll('[data-lang]').forEach(el=>el.classList.toggle('active',el.dataset.lang===l));$('hintButton').textContent=t('hint');$('help').textContent=t('help');$('gameTitle').textContent=t('level')+' '+currentLevel;renderLevels();renderScores();renderCoins();}function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');}function renderCoins(){$('coinsHome').textContent='🪙 '+coins;$('coinsLevels').textContent='🪙 '+coins;}function renderLevels(){$('progress').textContent=t('progress')+': '+unlocked+' / 12';$('levelList').innerHTML='';scenes.forEach((scene,i)=>{let n=i+1,btn=document.createElement('button');btn.className='level';btn.disabled=n>unlocked;let r=records[n];btn.innerHTML='<span class="scene">'+(n>unlocked?'🔒':scene)+'</span><span>'+t('level')+' '+n+'</span><br><span class="stars">'+(r?'★'.repeat(r.stars)+'☆'.repeat(3-r.stars):'☆☆☆')+'</span>';btn.onclick=()=>startLevel(n);$('levelList').appendChild(btn);});}function showLevels(){clearInterval(tick);renderCoins();renderLevels();show('levels');}function startLevel(n){if(n>unlocked)return;clearInterval(tick);currentLevel=n;finished=false;seconds=0;moves=0;matched=0;paused=false;locked=false;flipped=[];let count=Math.min(2+n,8);let base=icons.slice(0,count);deck=base.concat(base).map((v,i)=>({v,id:i,open:false,matched:false}));for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}$('gameTitle').textContent=t('level')+' '+n;$('pauseButton').textContent='⏸';draw();updateMetrics();show('game');tick=setInterval(()=>{if(!paused){seconds++;updateMetrics();}},1000);}
function draw(){$('board').innerHTML='';deck.forEach((card,i)=>{let b=document.createElement('button');b.className='tile'+(card.open?' open':'')+(card.matched?' matched':'');b.textContent=card.open||card.matched?card.v:'★';b.setAttribute('aria-label',card.open||card.matched?card.v:'Card '+(i+1));b.disabled=card.matched;b.onclick=()=>flip(i);$('board').appendChild(b);});}function updateMetrics(){$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');$('moves').textContent=moves;$('pairs').textContent=matched+'/'+(deck.length/2);}
function flip(i){if(paused||locked||finished||deck[i].open||deck[i].matched)return;deck[i].open=true;flipped.push(i);draw();if(flipped.length===2){moves++;updateMetrics();let[a,b]=flipped;if(deck[a].v===deck[b].v){deck[a].matched=deck[b].matched=true;matched++;flipped=[];draw();updateMetrics();if(matched===deck.length/2)win();}else{locked=true;setTimeout(()=>{deck[a].open=false;deck[b].open=false;flipped=[];locked=false;draw();},850);}}}
function togglePause(){paused=!paused;$('pauseButton').textContent=paused?'▶':'⏸';$('help').textContent=paused?t('paused'):t('help');}function pauseToLevels(){showLevels();}function hint(){if(paused||locked||finished||coins<50){if(coins<50)alert(t('noCoins'));return;}let hidden=deck.findIndex(c=>!c.matched&&!c.open);if(hidden<0)return;coins-=50;persist();renderCoins();let match=deck.findIndex((c,i)=>i!==hidden&&!c.matched&&!c.open&&c.v===deck[hidden].v);locked=true;deck[hidden].open=true;if(match>=0)deck[match].open=true;draw();setTimeout(()=>{deck[hidden].open=false;if(match>=0)deck[match].open=false;locked=false;draw();},1300);}
function win(){clearInterval(tick);finished=true;let pairs=deck.length/2,stars=moves<=pairs+1?3:moves<=pairs*2?2:1;let best=records[currentLevel];if(!best||stars>best.stars||(stars===best.stars&&seconds<best.seconds)){records[currentLevel]={stars,seconds,moves};}coins+=stars*20;unlocked=Math.max(unlocked,Math.min(12,currentLevel+1));persist();$('winDetail').textContent=t('congrats')+'! '+seconds+' '+t('sec')+' · '+moves+' '+t('moves')+' · 🪙 +'+stars*20;$('winStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);show('win');}function renderScores(){$('scoreList').innerHTML=Object.keys(records).sort((a,b)=>Number(a)-Number(b)).map(n=>'<p>'+t('level')+' '+n+' — '+('★'.repeat(records[n].stars))+' — '+records[n].seconds+' '+t('sec')+'</p>').join('')||'<p>—</p>';}function showScores(){clearInterval(tick);renderScores();show('scores');}
async function shareScore(){let s=t('shareText').replace('{level}',currentLevel).replace('{time}',seconds).replace('{moves}',moves);if(navigator.share){try{await navigator.share({title:t('title'),text:s,url:location.protocol.startsWith('http')?location.href:undefined});return;}catch(e){}}if(window.Telegram?.WebApp?.openTelegramLink&&location.protocol.startsWith('http')){window.Telegram.WebApp.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(location.href)+'&text='+encodeURIComponent(s));return;}if(navigator.clipboard){try{await navigator.clipboard.writeText(s);alert(lang==='ar'?'تم نسخ النتيجة':'Score copied');return;}catch(e){}}prompt(lang==='ar'?'انسخ نتيجتك':'Copy score',s);}
setLang(lang);show('home');if(window.Telegram?.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}
</script></body></html>
